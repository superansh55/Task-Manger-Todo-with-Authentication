name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**" # This pipeline only runs if backend code changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        # 1. Define the secrets securely in the action environment
        env:
          MONG_URI: ${{ secrets.MONG_URI }}
          SECRET: ${{ secrets.SECRET }}
          PORT: ${{ secrets.PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # 2. Pass them to the script without exposing them to bash parsing
          envs: MONG_URI,SECRET,PORT
          script: |
            # 1. Clone or update the code on the server
            if [ ! -d "task-manger-todo-with-authentication" ]; then
              git clone https://github.com/superansh55/task-manger-todo-with-authentication.git
            fi
            cd task-manger-todo-with-authentication
            git pull origin main

            # 2. Go to the backend directory
            cd backend

            # 3. Stop and remove the old container if it exists
            sudo docker stop ansh-task-backend || true
            sudo docker rm ansh-task-backend || true

            # 4. Build the new Docker image
            sudo docker build -t ansh-task-backend .

            # 5. Run the new container, injecting ALL secrets securely
            # Note: I am keeping -p 4000:4000 to map it to the AWS Firewall, 
            # while passing the internal PORT variable to Node.
            sudo docker run -d \
              --name ansh-task-backend \
              -p 4000:4000 \
              -e MONG_URI="$MONG_URI" \
              -e SECRET="$SECRET" \
              -e PORT="$PORT" \
              ansh-task-backend